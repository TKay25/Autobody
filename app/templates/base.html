<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ COMPANY.name }} — Workshop OS{% endblock %}</title>
  <meta name="description" content="{{ COMPANY.name }} workshop management system — job cards, estimating, quotations, parts and WhatsApp.">
  <meta name="theme-color" content="#08142c">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- No web font: `--tc-font` in app.css is a system stack on purpose, so type
       arrives instantly on a shop-floor tablet. An Inter stylesheet used to be
       linked here and nothing ever referenced it — a wasted request and two
       wasted preconnects on every page load. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ static_url('css/app.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="skip-link" href="#main-content">Skip to main content</a>
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
